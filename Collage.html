<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collage Site</title>
    <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      background: #1f3050;
      padding: 12px 30px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #fff;
      font-weight: bold;
    }

    .logo {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #e0e0e0;
      color: #555;
      font-size: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      padding: 6px 10px;
      border-radius: 4px;
      transition: 0.3s;
    }

    nav a:hover {
      background: #fff;
      color: #1f3050;
    }

    .welcome {
      padding: 30px;
    }

    .welcome p {
      margin-top: 8px;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      header {
        justify-content: center;
      }

      nav {
        justify-content: center;
      }
    }
    </style>
</head>
<body>
    <header>
        <div class="brand">
            <div class="logo">logo</div>
            <span>Bright Future Collage</span>
        </div>
        <nav>
            <a href="#">Home</a>
            <a href="#">About Us</a>
            <a href="#">Courses</a>
            <a href="#">Admissions</a>
            <a href="#">Contact Us</a>
        </nav>
    </header>

    <div class="Welcome">
        <h2>Welcome to Bright Future Collage</h2>
        <p>Learn,Grow,build your Future with us.</p>
    </div>
</body>
</html>
