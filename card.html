<!DOCTYPE html>
<html>
<head>
<style>
  .card {
    width: 280px; margin: 20px; padding: 15px;
    background: white; border: 4px solid lightslategray; outline: 2px solid #000;
    border-radius: 5px; text-align: center; font-family: Arial, sans-serif;
  }
  .card img {
    width: 150px; height: 150px;
    object-fit: cover; border-radius: 50%;
  } 
</style>
</head>
<body>
  <div class="card">
    <img src="https://placehold.co/150?text=Student" alt="Student">
    <h2>Rahul Sharma</h2>
    <h4>Full Stack Development</h4>
    <p>Email: rahul@gmail.com</p>
    <a href="mailto:rahul@gmail.com">Contact student</a>
  </div>
</body>
</html>
