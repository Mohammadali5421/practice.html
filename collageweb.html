<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>collageweb</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        
        header {
            justify-content: space-between;
            display: flex;
            color: wheat;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            background: black;
            padding: 12px 30px;
        }
        .brand{
            display: flex;
            align-items: center;
            gap: 15px;
            color: white;
            font-weight: bold ;
        }
        .logo {
            align-items: center;
            display: flex;
            justify-content: center;
            background: skyblue;
            font-size: 10px;
            width: 36px;
            height: 36px;
            border: 1px solid black;
            border-radius: 50%;
        }
        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        nav a {
            color: white;
            text-decoration: none;
            font-size: 20px;
            padding: 6px 10px;
            border-radius: 4px;
            transition: 0.3s;
        }
        nav a:hover {
            background-color: maroon;
        }
        nav a:hover:active {
            background-color: rosybrown;
        }
        .welcome {
            padding: 30px;
        }
    </style>
</head>
<body>
    <header>
        <div class="brand">
            <div class="logo">logo</div>
            <span>Bright Future Collage</span>
        </div>
        <nav>
        <a href="#">Home</a>
        <a href="#">About Us</a>
        <a href="#">Course</a>
        <a href="#">Admissions</a>
        <a href="#">Contact Us</a>
        </nav>
    </header>
    <div class="welcome">
        <h2>Welcome to Bright future Collage</h2>
        <p>Learn,Grow,build your Future with us.</p>
    </div>
</body>
</html>
